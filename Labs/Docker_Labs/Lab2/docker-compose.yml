services:
  # Service 1: Train the model
  model-training:
    image: python:3.13-slim
    container_name: ml_trainer
    working_dir: /app
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - model_exchange:/exchange   # Shared volume mount
    # Run training -> Copy result to shared folder
    command: >
      sh -c "pip install -r requirements.txt &&
             python src/model_training.py &&
             cp my_nn_wine_model.keras /exchange/my_model.keras &&
             cp wine_encoder.pkl /exchange/wine_encoder.pkl &&
             cp wine_scaler.pkl /exchange/wine_scaler.pkl"

  # Service 2: Serve the model
  serving:
    image: python:3.13-slim
    container_name: ml_serving
    working_dir: /app
    ports:
      - "8080:3000"
    volumes:
      - ./src:/app/src
      - ./requirements.txt:/app/requirements.txt
      - ./src/templates:/app/templates
      - ./src/statics:/app/statics
      - model_exchange:/exchange   # Shared volume mount
    depends_on:
      model-training:
        condition: service_completed_successfully
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PORT=3000
    # Copy result FROM shared folder -> Run server
    command: >
      sh -c "pip install --trusted-host pypi.python.org -r requirements.txt &&
             cp /exchange/wine_encoder.pkl ./wine_encoder.pkl &&
             cp /exchange/wine_scaler.pkl ./wine_scaler.pkl &&
             cp /exchange/my_model.keras ./my_nn_wine_model.keras &&
             python src/main.py"

volumes:
  model_exchange: