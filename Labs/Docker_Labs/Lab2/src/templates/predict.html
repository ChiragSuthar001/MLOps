<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wine Classifier | AI Prediction</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00f2ff; /* Cyber Cyan */
            --secondary: #bd00ff; /* Neon Purple */
            --bg-dark: #0f172a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at top left, #1a1a2e, #16213e, #0f172a);
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        /* Ambient Background Glow */
        body::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            width: 40%;
            height: 40%;
            background: radial-gradient(circle, var(--secondary), transparent 70%);
            opacity: 0.2;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s infinite alternate;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
            width: 90%;
            max-width: 1100px;
            position: relative;
        }

        /* Glass Card Effect */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 2rem;
            background: linear-gradient(to right, var(--primary), var(--secondary));
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.3);
            letter-spacing: 2px;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0 1.25rem;
        }

        .input-grid .input-group {
            flex: 0 0 calc((100% - 2.5rem) / 3);
            min-width: 0;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input[type="number"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-sizing: border-box; /* Fixes padding width issue */
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }

        button.submit-btn {
            flex: 1;
            padding: 16px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .action-row {
            display: flex;
            align-items: stretch;
            gap: 20px;
            margin-top: 1rem;
        }

        .random-btn {
            flex: 0 0 10%;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--primary);
            border-radius: 12px;
            color: var(--primary);
            background: rgba(0, 242, 255, 0.08);
            cursor: pointer;
        }

        .random-btn:hover {
            background: rgba(0, 242, 255, 0.18);
        }

        .random-btn svg {
            width: 34px;
            height: 29px;
        }

        .action-row .submit-btn {
            margin-top: 0;
        }

        button.submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3);
        }

        button.submit-btn:active {
            transform: translateY(0);
        }

        /* Prediction Result Area */
        .result-container {
            margin-top: 20px;
            text-align: center;
            overflow: hidden;
            transition: all 0.5s ease;
            opacity: 0;
            transform: translateY(20px);
            display: none; /* Hidden by default */
        }

        .result-container.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .prediction-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 50px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron', sans-serif;
            margin-bottom: 15px;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
        }

        .flower-card {
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px;
            border: 1px solid var(--glass-border);
        }

        .flower-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(20px, 20px); }
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 760px) {
            .input-grid .input-group {
                flex-basis: calc((100% - 1.25rem) / 2);
            }
        }

        @media (max-width: 480px) {
            .input-grid .input-group {
                flex-basis: 100%;
            }
        }

    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

    <div class="container">
        <div class="glass-card">
            <h1>WINE CLASSIFIER</h1>
            
            <form id="predictionForm">
                <div class="input-grid">
                    <div class="input-group"><label for="alcohol">Alcohol</label><input type="number" id="alcohol" step="any" required></div>
                    <div class="input-group"><label for="malic_acid">Malic acid</label><input type="number" id="malic_acid" step="any" required></div>
                    <div class="input-group"><label for="ash">Ash</label><input type="number" id="ash" step="any" required></div>
                    <div class="input-group"><label for="alcalinity_of_ash">Alcalinity of ash</label><input type="number" id="alcalinity_of_ash" step="any" required></div>
                    <div class="input-group"><label for="magnesium">Magnesium</label><input type="number" id="magnesium" step="any" required></div>
                    <div class="input-group"><label for="total_phenols">Total phenols</label><input type="number" id="total_phenols" step="any" required></div>
                    <div class="input-group"><label for="flavanoids">Flavanoids</label><input type="number" id="flavanoids" step="any" required></div>
                    <div class="input-group"><label for="nonflavanoid_phenols">Nonflavanoid phenols</label><input type="number" id="nonflavanoid_phenols" step="any" required></div>
                    <div class="input-group"><label for="proanthocyanins">Proanthocyanins</label><input type="number" id="proanthocyanins" step="any" required></div>
                    <div class="input-group"><label for="color_intensity">Color intensity</label><input type="number" id="color_intensity" step="any" required></div>
                    <div class="input-group"><label for="hue">Hue</label><input type="number" id="hue" step="any" required></div>
                    <div class="input-group"><label for="od280_od315_of_diluted_wines">OD280/OD315 diluted wines</label><input type="number" id="od280_od315_of_diluted_wines" step="any" required></div>
                    <div class="input-group"><label for="proline">Proline</label><input type="number" id="proline" step="any" required></div>
                </div>

                <div class="action-row">
                <button type="button" id="randomButton" class="random-btn" title="Fill with a random wine sample" aria-label="Fill with a random wine sample">
                    <svg viewBox="0 0 24 24" role="img" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="0 5 7 5 17 20 25 20" />
                        <polyline points="0 20 7 20 17 5 25 5" />
                        <polyline points="23 2 25 5 23 8" />
                        <polyline points="23 17 25 20 23 23" />
                    </svg>
                </button>
                <button type="submit" class="submit-btn">
                    <span id="btnText">ANALYZE</span>
                    <div class="spinner" id="btnSpinner"></div>
                </button>
                </div>
            </form>
        </div>

        <div id="resultArea" class="glass-card result-container">
            <div class="prediction-badge">PREDICTED CULTIVAR</div>
            <h2 id="predictedClass" style="margin: 10px 0; color: #fff; font-family: 'Orbitron', sans-serif;"></h2>
        </div>
    </div>

    <script>
        $(document).ready(function() {
            const featureRanges = {
                alcohol: [11, 14.8, 2],
                malic_acid: [0.7, 5.8, 2],
                ash: [1.3, 3.2, 2],
                alcalinity_of_ash: [10.6, 30, 1],
                magnesium: [70, 162, 0],
                total_phenols: [0.9, 3.9, 2],
                flavanoids: [0.3, 5.1, 2],
                nonflavanoid_phenols: [0.1, 0.7, 2],
                proanthocyanins: [0.4, 3.6, 2],
                color_intensity: [1.2, 13, 2],
                hue: [0.4, 1.8, 2],
                od280_od315_of_diluted_wines: [1.2, 4.2, 2],
                proline: [278, 1680, 0]
            };

            $('#randomButton').on('click', function() {
                Object.entries(featureRanges).forEach(function([field, range]) {
                    const [minimum, maximum, decimals] = range;
                    const value = minimum + Math.random() * (maximum - minimum);
                    $('#' + field).val(value.toFixed(decimals));
                });
            });

            $('#predictionForm').on('submit', function(event) {
                event.preventDefault(); 
                
                // UI Loading State
                var $btn = $('.submit-btn');
                var $text = $('#btnText');
                var $spinner = $('#btnSpinner');
                
                $text.hide();
                $spinner.show();
                $btn.css('opacity', '0.7');

                var formData = {};
                $('#predictionForm input').each(function() {
                    formData[this.id] = this.value;
                });

                $.ajax({
                    type: 'POST',
                    url: '/predict',
                    contentType: 'application/json',
                    data: JSON.stringify(formData),
                    dataType: 'json',
                }).done(function(data) {
                    
                    // Update Text
                    $('#predictedClass').text(data.predicted_class.toUpperCase());
                    
                    // Show Result with animation
                    $('#resultArea').addClass('active');

                    // Reset Button
                    $text.show();
                    $spinner.hide();
                    $btn.css('opacity', '1');

                }).fail(function(data) {
                    alert('SYSTEM ERROR: Neural Link Disconnected.');
                    $text.show();
                    $spinner.hide();
                    $btn.css('opacity', '1');
                });
            });
        });
    </script>
</body>
</html>
